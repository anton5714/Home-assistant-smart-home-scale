esphome:
  name: esp-bt

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret esphome_api_encryption_key

ota:
  password: !secret esphome_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Если хотите использовать статический IP — раскомментируйте и заполните в secrets.yaml
  # fast_connect: true
  # manual_ip:
  #   static_ip: !secret esphome_static_ip
  #   gateway: !secret esphome_gateway
  #   subnet: !secret esphome_subnet

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

time:
  - platform: sntp
    id: esptime

sensor:
  - platform: uptime
    name: "ESP Uptime"
  - platform: wifi_signal
    name: "ESP WiFi Signal"
    update_interval: 60s

# Пример компонента для поддержки Mi Scale 2, если он доступен в вашей версии ESPHome.
# Замените MAC на обнаруженный при сканировании.
# Если этот компонент недоступен, используйте только esp32_ble_tracker + bluetooth_proxy
