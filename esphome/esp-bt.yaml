esphome:
  name: esp-bt

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret esphome_api_encryption_key

ota:
  password: !secret esphome_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 15min
  # Для использования статического IP раскомментируйте блок ниже и заполните
  # значения в secrets.yaml (esphome_static_ip, esphome_gateway, esphome_subnet)
  # manual_ip:
  #   static_ip: !secret esphome_static_ip
  #   gateway: !secret esphome_gateway
  #   subnet: !secret esphome_subnet

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

time:
  - platform: sntp
    id: esptime
    on_time:
      - seconds: 0
        minutes: 0
        hours: 4
        then:
          - button.press: restart_esp

sensor:
  - platform: uptime
    name: "ESP Uptime"
  - platform: wifi_signal
    name: "ESP WiFi Signal"
    update_interval: 60s

button:
  - platform: restart
    id: restart_esp
    name: "Restart ESP"
