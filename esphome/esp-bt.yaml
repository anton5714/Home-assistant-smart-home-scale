esphome:
  name: esp-bt

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret esphome_api_encryption_key

ota:
  password: !secret esphome_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 15min

# Поддержка BLE для прокси/сканирования
esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

# Если ваша версия ESPHome поддерживает nативный компонент для Mi Scale 2,
# раскомментируйте и вставьте MAC ваших весов в поле mac_address:
# sensor:
#   - platform: xiaomi_miscale2
#     mac_address: 'AA:BB:CC:DD:EE:FF'  # <- замените на MAC ваших весов
#     name: "Mi Scale 2"
#     update_interval: 10s
#     weight:
#       name: "Mi Scale Weight"
#     impedance:
#       name: "Mi Scale Impedance"

# Если xiaomi_miscale2 не доступен, используйте Bluetooth proxy + BLE Monitor в Home Assistant

sensor:
  - platform: uptime
    name: "ESP Uptime"
  - platform: wifi_signal
    name: "ESP WiFi Signal"
    update_interval: 60s

button:
  - platform: restart
    id: restart_esp
    name: "Restart ESP"
