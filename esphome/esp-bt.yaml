substitutions:
  device_name: mi-scale-bridge
  friendly_name: Mi Scale Bridge

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret esphome_api_encryption_key

ota:
  - platform: esphome
    password: !secret esphome_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 15min

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

# Xiaomi Mi Scale / Mi Scale 2.
# Mi Scale 2 can expose both weight and impedance.
# Replace the MAC address with your scale's Bluetooth MAC.
sensor:
  - platform: xiaomi_miscale
    mac_address: "AA:BB:CC:DD:EE:FF"
    weight:
      name: "Mi Scale Weight"
      id: mi_scale_weight
      unit_of_measurement: "kg"
      device_class: weight
      state_class: measurement
      accuracy_decimals: 2
    impedance:
      name: "Mi Scale Impedance"
      id: mi_scale_impedance
      unit_of_measurement: "Ω"
      state_class: measurement
      accuracy_decimals: 0
    clear_impedance: true

  - platform: uptime
    name: "ESP Uptime"
    entity_category: diagnostic

  - platform: wifi_signal
    name: "ESP WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart ESP"
    entity_category: config
