# Шаблонные sensors для расчётов состава тела
# Фай��л готов для копирования: вставьте в configuration.yaml как template: !include home-assistant/sensors/body_analysis.yaml

# Ожидаемые входные сущности:
# - sensor.mi_scale_weight  (кг)
# - sensor.mi_scale_impedance (ом или значение от весов)
# - input_number.user_height (см)
# - input_number.user_age
# - input_select.user_gender ('male' или 'female')

sensors:
  - name: "body_bmi"
    state: >
      {% set weight = states('sensor.mi_scale_weight') | replace(',','.') | float(0) %}
      {% set height_cm = states('input_number.user_height') | float(0) %}
      {% set height_m = (height_cm / 100) if height_cm > 0 else 0 %}
      {% if height_m > 0 and weight > 0 %}
        {{ (weight / (height_m * height_m)) | round(1) }}
      {% else %}
        unknown
      {% endif %}
    unit_of_measurement: ''
    friendly_name: 'BMI (ИМТ)'

  - name: "body_fat_percentage"
    state: >
      {% set weight = states('sensor.mi_scale_weight') | replace(',','.') | float(0) %}
      {% set impedance = states('sensor.mi_scale_impedance') | replace(',','.') | float(0) %}
      {% if weight == 0 or impedance == 0 %}
        unknown
      {% else %}
        {# Простая приближённая оценка: замените на более точный алгоритм при желании #}
        {{ (weight * 0.1) | round(1) }}
      {% endif %}
    unit_of_measurement: '%'
    friendly_name: 'Процент жира (прибл.)'

  - name: "muscle_mass"
    state: >
      {% set weight = states('sensor.mi_scale_weight') | replace(',','.') | float(0) %}
      {% if weight > 0 %}
        {{ (weight * 0.4) | round(1) }}
      {% else %}
        unknown
      {% endif %}
    unit_of_measurement: 'kg'
    friendly_name: 'Мышечная масса (прибл.)'
