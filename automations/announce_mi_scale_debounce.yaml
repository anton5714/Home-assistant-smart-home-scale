# Вариант с простым дебаунсом: триггер с for и проверкой разницы между старым и новым значением
alias: Анализ тела - Антон (debounce)
description: То же, но автоматизация с фильтром изменения >0.1 кг и "for" 3 секунды
trigger:
  - platform: state
    entity_id: sensor.vesy_weight
    for: "00:00:03"
condition:
  - condition: template
    value_template: >
      {% set f = trigger.from_state.state | float(0) %}
      {% set t = trigger.to_state.state | float(0) %}
      {{ (t >= 80) and ((t - f) | abs > 0.1) }}
action:
  - delay: "00:00:08"
  - service: media_player.play_media
    target:
      device_id: d8bb03c0b571d5da161593553246cd7d
    data:
      media:
        media_content_id: "{{ 'Вес ' ~ (trigger.to_state.state | round(1)) ~ ' кг.' }}"
        media_content_type: text
  - delay: "00:00:28"
  - service: media_player.play_media
    target:
      device_id: d8bb03c0b571d5da161593553246cd7d
    data:
      media:
        media_content_id: >-
          sendText Проанализируй мои фитнес метрики и дай одну короткую
          рекомендацию на сегодня. Мой вес {{ trigger.to_state.state | round(1)
          }} кг. Цель 81 кг. Ответь кратко как тренер и диетолог.
        media_content_type: command
mode: single
