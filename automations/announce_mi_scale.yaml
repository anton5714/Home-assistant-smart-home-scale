alias: Анализ тела - Антон
description: Озвучка цифр с гарантированной паузой в 18 секунд и последующим ИИ-советом
trigger:
  - platform: state
    entity_id: sensor.vesy_weight
condition:
  - condition: template
    value_template: "{{ trigger.to_state.state | float(0) >= 80 }}"
action:
  - delay: "00:00:08"
  - service: media_player.play_media
    target:
      device_id: d8bb03c0b571d5da161593553246cd7d
    data:
      media:
        media_content_id: >-
          {% set w = trigger.to_state.state | float(0) %} {% set fat_pct =
          states('sensor.protsent_zhira') | replace(',', '.') | float(0) %} {%
          set fat_kg = states('sensor.massa_zhira') | replace(',', '.') |
          float(0) %} {% set muscle = states('sensor.myshechnaia_massa') |
          replace(',', '.') | float(0) %} {% set water =
          states('sensor.voda_v_organizme') | replace(',', '.') | float(0) %} {%
          set visceral = states('sensor.vistseralnyi_zhir') | replace(',', '.')
          | float(0) %}

          {% macro fmt_kg(val) %}{% set f = val | float(0) | round(1) %}{% set s
          = f | string %}{% if '.' in s and s.split('.') != '0' %}{{ f }}
          килограмма{% else %}{% set i = f | int %}{% set d = i % 10 %}{% set t
          = i % 100 %}{% if t >= 11 and t <= 14 %}{{ i }} килограммов{% elif d
          == 1 %}{{ i }} килограмм{% elif d >= 2 and d <= 4 %}{{ i }}
          килограмма{% else %}{{ i }} килограммов{% endif %}{% endif %}{%
          endmacro %} {% macro fmt_pct(val) %}{% set f = val | float(0) |
          round(1) %}{% set s = f | string %}{% if '.' in s and s.split('.') !=
          '0' %}{{ f }} процента{% else %}{% set i = f | int %}{% set d = i % 10
          %}{% set t = i % 100 %}{% if t >= 11 and t <= 14 %}{{ i }} процентов{%
          elif d == 1 %}{{ i }} процент{% elif d >= 2 and d <= 4 %}{{ i }}
          процента{% else %}{{ i }} процентов{% endif %}{% endif %}{% endmacro
          %} {% macro fmt_unit(val) %}{% set i = val | float(0) | round(0) | int
          %}{% set d = i % 10 %}{% set t = i % 100 %}{% if t >= 11 and t <= 14
          %}{{ i }} единиц{% elif d == 1 %}{{ i }} единица{% elif d >= 2 and d
          <= 4 %}{{ i }} единицы{% else %}{{ i }} единиц{% endif %}{% endmacro
          %}

          Антон, ваши точные показатели. Вес {{ fmt_kg(w) }}. Жир {{
          fmt_pct(fat_pct) }}, это {{ fmt_kg(fat_kg) }}. Мышцы {{ fmt_kg(muscle)
          }}. Вода {{ fmt_pct(water) }}. Внутренний жир {{ fmt_unit(visceral)
          }}. {% if w > 81 %}До цели в 81 килограмм осталось скинуть {{ fmt_kg(w
          - 81) }}.{% endif %}
        media_content_type: text
        metadata: {}
  - delay: "00:00:28"
  - service: media_player.play_media
    target:
      device_id: d8bb03c0b571d5da161593553246cd7d
    data:
      media:
        media_content_id: >-
          {% set w = trigger.to_state.state | float(0) | round(1) %} {% set
          fat_pct = states('sensor.protsent_zhira') | replace(',', '.') |
          float(0) | round(1) %} {% set water =
          states('sensor.voda_v_organizme') | replace(',', '.') | float(0) |
          round(1) %} {% set visceral = states('sensor.vistseralnyi_zhir') |
          replace(',', '.') | float(0) | round(0) %}

          sendText Проанализируй мои фитнес метрики и дай одну короткую
          рекомендацию на сегодня. Мой вес {{ w }} кг, жир {{ fat_pct }}
          процентов, вода {{ water }} процентов, висцеральный жир {{ visceral
          }}. Цель 81 кг. Ответь кратко как тренер и диетолог, в одно-два
          предложения. Начни фразу со слов сегодня тебе
        media_content_type: command
        metadata: {}
mode: single
