name: ESPHome

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate ESPHome configuration
        uses: esphome/build-action@v8.0.0
        with:
          yaml-file: esphome/esp-bt.yaml
          version: latest
          skip-checks: false
