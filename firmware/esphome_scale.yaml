esphome:
  name: mi_scale_bridge
  platform: ESP32
  board: esp32dev

# --- Настройки Wi-Fi (заполните в secrets.yaml или импортируйте как env) ---
wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"

# Optional: статический IP
#  manual_ip:
#    static_ip: 192.168.1.50
#    gateway: 192.168.1.1
#    subnet: 255.255.255.0

# Enable logging
logger:

# Enable Home Assistant API
api:
  password: "YOUR_API_PASSWORD"

ota:
  password: "YOUR_OTA_PASSWORD"

# BLE tracker — для сканирования BLE-устройств (Xiaomi Mi Scale передаёт данные по BLE)
esp32_ble_tracker:

# Пример текстового сенсора — замените на нужный custom_component для декодирования Mi Scale
text_sensor:
  - platform: template
    name: "Mi Scale Weight Raw"
    lambda: |-
      // Здесь можно возвращать строку с разобранными данными веса
      return {"unknown"};

# Пример сенсора веса — замените на реальную реализацию/костомную интеграцию
sensor:
  - platform: template
    name: "Mi Scale Weight"
    unit_of_measurement: "kg"
    lambda: |-
      // Верните число веса как float
      return 0.0;

# Комментарии:
# 1) Xiaomi Mi Scale 2 не всегда сразу поддерживается стандартными ESPHome компонентами.
# 2) Для корректного парсинга пакетов может понадобиться сторонняя библиотека/C++ код
#    или использование готовых кастомных компонентов (search: "mi scale esphome custom component").
# 3) Храните Wi-Fi и API пароли в secrets.yaml и не пушьте их в репозиторий.
